name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Gaode.slnx --locked-mode
      - name: Build
        run: dotnet build Gaode.slnx -c Release --no-restore
      - name: Test core rules and HTTP contracts
        run: dotnet test Gaode.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Publish Host
        run: dotnet publish backend/src/Inspection.Host -c Release --no-restore -o artifacts/host
      - name: Test published process
        run: ./scripts/smoke-host.ps1 -HostDirectory artifacts/host
      - name: Record artifact provenance
        run: |
          @{ commit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; os = '${{ matrix.os }}'; stage = 'EngineeringFoundation'; architecture = '1.3' } |
            ConvertTo-Json | Set-Content artifacts/host/build-manifest.json
          Copy-Item scripts/smoke-host.ps1 artifacts/host/smoke-host.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/host/smoke-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified foundation Host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-host-${{ matrix.os }}
          path: artifacts/host/
          if-no-files-found: error
          retention-days: 14

  virtual-plc:
    name: Virtual PLC framework (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build production targets and verify independent PLC integration
        run: python scripts/validate-virtual-plc.py
      - name: Upload all framework attempts (not FullSim acceptance)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtual-plc-framework-evidence-${{ matrix.os }}
          path: simulator/artifacts/
          if-no-files-found: error
          retention-days: 14
