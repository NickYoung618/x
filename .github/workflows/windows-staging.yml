name: Windows staging foundation smoke

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main Core CI run ID whose Windows Host artifact will be tested
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gaode-windows-staging
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Verify successful trusted CI source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['SOURCE_RUN_ID']
          if not run_id.isascii() or not run_id.isdigit():
              raise SystemExit('ci_run_id must be numeric')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if not (run['status'] == 'completed' and run['conclusion'] == 'success'
                  and run['head_branch'] == 'main'
                  and run['event'] in ('push', 'workflow_dispatch')
                  and run['path'] == '.github/workflows/ci.yml'
                  and run['head_repository']['full_name'] == repo):
              raise SystemExit('Select a successful main Core CI run from this repository')
          sha = run['head_sha']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Invalid commit provenance')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'commit={sha}\n')
          print(f'Verified Core CI run {run_id}, commit {sha}')
          PY

  deployed-host:
    needs: verify-source
    runs-on: [self-hosted, Windows, X64, gaode-staging]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_COMMIT: ${{ needs.verify-source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source.outputs.commit }}
      - name: Choose isolated deployment directory
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "gaode-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "TEST_PACKAGE=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundation-host-windows-2022
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.TEST_PACKAGE }}
      - name: Check package provenance and local runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content (Join-Path $env:TEST_PACKAGE 'build-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:SOURCE_COMMIT -or $manifest.stage -ne 'EngineeringFoundation') {
            throw 'Downloaded package provenance mismatch.'
          }
          $runtime = & dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtime -match '^Microsoft.AspNetCore.App 10\.')) {
            throw 'Install the .NET 10 ASP.NET Core Runtime for this foundation Host before testing.'
          }
          $runtime | Set-Content (Join-Path $env:TEST_PACKAGE 'runtime.log')
          [System.Environment]::OSVersion.VersionString | Set-Content (Join-Path $env:TEST_PACKAGE 'windows.log')
      - name: Execute downloaded Host on the actual Windows server
        run: ./scripts/smoke-host.ps1 -HostDirectory $env:TEST_PACKAGE
      - name: Save staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-staging-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_PACKAGE }}/*.log
            ${{ env.TEST_PACKAGE }}/build-manifest.json
          if-no-files-found: warn
          retention-days: 14
